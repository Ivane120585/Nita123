name: .NET CI

on:
  push:
    branches: [Ivo120585]
  pull_request:
    branches: [Ivo120585]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 3.1.x

      - name: Install .NET Core 3.1 native dependencies
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      - name: Restore
        run: dotnet restore BankSystem.sln
        working-directory: src

      - name: Build
        run: dotnet build BankSystem.sln --no-restore
        working-directory: src

      - name: Test
        run: dotnet test BankSystem.sln --no-restore --no-build --logger:"liquid.md;LogFileName=${{ github.workspace }}/TestReport.md;Title=Test Run ${{ github.run_number }}"
        working-directory: src

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: TestReport.md
          if-no-files-found: ignore
