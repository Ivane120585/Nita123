name: .NET CI

on:
  push:
    branches: [Ivo120585]
  pull_request:
    branches: [Ivo120585]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:3.1
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Restore
        run: dotnet restore BankSystem.sln
        working-directory: src

      - name: Build
        run: dotnet build BankSystem.sln --no-restore
        working-directory: src

      - name: Test
        run: dotnet test BankSystem.sln --no-restore --no-build --logger:"liquid.md;LogFileName=${{ github.workspace }}/TestReport.md;Title=Test Run ${{ github.run_number }}"
        working-directory: src

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: TestReport.md
          if-no-files-found: ignore
